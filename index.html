<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prajval P | Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-gradient"></div>

    <!-- Fixed Left Sidebar -->
    <aside class="sidebar">
        <img src="" alt="Profile" class="profile-img" id="profile-img">
        <h1 class="profile-name" id="profile-name"></h1>
        <p class="profile-title" id="profile-title"></p>
        <p class="profile-about" id="profile-about"></p>
        <!-- 1. Contact Info moved here -->
        <div class="contact-info" id="contact-info"></div>
        <div class="social-links" id="social-links"></div>
        <!-- 2. New Timeline Section -->
        <div class="timeline-section">
            <h3 class="timeline-title">Experience</h3>
            <div class="timeline" id="experience-timeline"></div>

            <h3 class="timeline-title">Education</h3>
            <div class="timeline" id="education-timeline"></div>
        </div>


    </aside>

    <!-- Scrollable Right Content Area -->
    <main class="main-content">
        <!-- Latest Work -->
        <section class="latest-work">
            <div class="section-title">Featured Work</div>
            <div id="featured-content">
                <!-- Populated by JS -->
            </div>
        </section>
        <!-- Controls (Sticky) -->
        <div class="controls-bar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('projects')">Projects</button>
                <button class="tab-btn" onclick="switchTab('articles')">Articles</button>
            </div>
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search projects, tags..." onkeyup="filterContent()">
            </div>
        </div>

        <!-- Grid Content -->
        <div class="content-grid" id="content-grid">
            <!-- Populated by JS -->
        </div>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
